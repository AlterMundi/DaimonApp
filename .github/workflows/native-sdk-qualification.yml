name: Interaction native SDK qualification
on:
  # Qualify each exact native pin once through the existing manual route.
  # PR path filters compare the cumulative diff, causing App-only commits to
  # cancel/rebuild the same immutable native source repeatedly.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    uses: compaii/codex/.github/workflows/interaction-goal-controls.yml@c9f1a4e20c2a405acf3dcf53eb366158aff73613
    with:
      source_ref: c9f1a4e20c2a405acf3dcf53eb366158aff73613
