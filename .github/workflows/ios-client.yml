name: iOS native audio preparation
on:
  pull_request:
    paths: ['clients/ios/**', '.github/workflows/ios-client.yml']
  push:
    branches: [master]
    paths: ['clients/ios/**', '.github/workflows/ios-client.yml']
permissions:
  contents: read
concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-audio:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and test the bounded native audio core
        working-directory: clients/ios
        run: swift test --jobs 2 --scratch-path "$RUNNER_TEMP/daimon-ios-build"
