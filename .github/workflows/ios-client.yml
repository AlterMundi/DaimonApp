name: iOS native audio preparation
on:
  pull_request:
    paths: ['clients/ios/**', '.github/workflows/ios-client.yml']
  push:
    branches: [master]
    paths: ['clients/ios/**', '.github/workflows/ios-client.yml']
permissions:
  contents: read
concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-audio:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and test the bounded native audio core
        working-directory: clients/ios
        run: swift test --jobs 2 --scratch-path "$RUNNER_TEMP/daimon-ios-build"
      - name: Compile the same sources against the iOS Simulator SDK
        working-directory: clients/ios
        run: |
          mkdir -p "$RUNNER_TEMP/daimon-ios-sdk"
          xcrun --sdk iphonesimulator swiftc -swift-version 5 \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -target arm64-apple-ios17.0-simulator -emit-library -emit-module \
            -module-name DaimonNativeAudio Sources/DaimonNativeAudio/*.swift \
            -o "$RUNNER_TEMP/daimon-ios-sdk/libDaimonNativeAudio.dylib" \
            -emit-module-path "$RUNNER_TEMP/daimon-ios-sdk/DaimonNativeAudio.swiftmodule"
