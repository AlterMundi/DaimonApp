plugins { id 'com.android.application' }
android {
    namespace 'homes.dmn.interaction'
    compileSdk 36
    defaultConfig {
        applicationId 'homes.dmn.interaction.pilot'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '0.7.0-pilot'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.activity:activity:1.10.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
// Exercise the exact web conversion source in the instrumented WebView, without
// adding qualification scripts to the installed application's asset package.
def webAudioTestAssets = tasks.register('webAudioTestAssets', Copy) {
    from('../../../dashboard/web') { include 'webrtc-native-audio.js', 'voice-output-pcm.js' }
    into(layout.buildDirectory.dir('generated/webAudioTestAssets'))
}
android.sourceSets.androidTest.assets.srcDir(layout.buildDirectory.dir('generated/webAudioTestAssets'))
tasks.configureEach {
    if (name.startsWith('merge') && name.endsWith('AndroidTestAssets')) dependsOn(webAudioTestAssets)
}
